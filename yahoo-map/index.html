<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>住所でヤフーマップ</title>
<meta name="theme-color" content="#d1243a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="住所マップ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Layout: one narrow column; address field, town chips, number helpers, big link button */
  :root {
    --bg: #f5f7f6; --fg: #1d2523; --muted: #5d6a66; --line: #c9d3cf;
    --accent: #d1243a; --accent-fg: #ffffff; --field: #ffffff; --chip: #e6ecea;
    --font: "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #161b1a; --fg: #e8eeec; --muted: #9aa8a3; --line: #34403c;
    --accent: #e8475b; --accent-fg: #ffffff; --field: #1f2624; --chip: #26302d; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #161b1a; --fg: #e8eeec; --muted: #9aa8a3; --line: #34403c;
    --accent: #e8475b; --accent-fg: #ffffff; --field: #1f2624; --chip: #26302d; color-scheme: dark }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width: 520px; margin: 0 auto; padding-block: 28px 40px; display: grid; gap: 18px; }
  h1 { font-size: 1.4rem; margin: 0; text-wrap: balance; }
  label, .label { font-weight: 700; font-size: .9rem; }
  .field { display: grid; gap: 8px; }
  input { font: inherit; font-size: 18px; padding: 14px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--field); color: var(--fg); width: 100%; box-sizing: border-box; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { font: inherit; font-size: 15px; padding: 10px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--chip); color: var(--fg); cursor: pointer; }
  .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .chips button:focus-visible, .tools button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tools { display: flex; gap: 8px; }
  .tools button { font: inherit; font-size: 16px; padding: 10px 16px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--field); color: var(--fg); cursor: pointer; }
  .tools a.search { flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px;
    background: var(--accent); color: var(--accent-fg); font-weight: 700; text-decoration: none; font-size: 16px; }
  .tools a.search:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .clear { font: inherit; font-size: .85rem; background: none; border: none; color: var(--muted);
    text-decoration: underline; cursor: pointer; padding: 4px; }
  .saved { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .saved li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  .saved a { flex: 1; min-width: 0; padding: 14px 4px; color: var(--fg); text-decoration: none; overflow-wrap: anywhere; }
  .saved a:focus-visible, .clear:focus-visible, .saved button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .saved button { font: inherit; font-size: 18px; width: 40px; height: 40px; border: none; background: none;
    color: var(--muted); cursor: pointer; }
  .empty { color: var(--muted); font-size: .9rem; margin: 0; }
  [hidden] { display: none !important; }
  .chips.editing button { border-style: dashed; }
  .chips.editing button::after { content: " ×"; color: var(--accent); font-weight: 700; }
  .town-edit { display: grid; gap: 8px; }
  .add-row { display: flex; gap: 8px; margin: 0; }
  .add-row input { flex: 1; min-width: 0; font-size: 16px; padding: 10px 12px; }
  .add-row button { font: inherit; font-size: 16px; padding: 10px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: var(--accent-fg); font-weight: 700; cursor: pointer; }
  .hint { margin: 0; color: var(--muted); font-size: .85rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
</style>
</head>
<body>

<main>
  <h1>住所でヤフーマップ</h1>
  <div class="field">
    <div class="head">
      <label for="address">住所</label>
      <button type="button" class="clear" id="editBase">はじめの住所を編集</button>
    </div>
    <form class="town-edit" id="baseEdit" hidden>
      <div class="add-row">
        <input id="baseInput" type="text" placeholder="例：新潟県新潟市中央区" autocomplete="off">
        <button type="submit">保存</button>
      </div>
      <p class="hint">町名ボタンを押したとき、この住所の後ろに町名が入ります。<button type="button" class="clear" id="resetBase">最初の住所にもどす</button></p>
    </form>
    <input id="address" type="text" value="新潟県新潟市中央区 " autocomplete="off">
    <div class="tools">
      <button type="button" data-insert="-">−（ハイフン）</button>
      <a id="search" class="search" href="#" target="_blank" rel="noopener">検索</a>
    </div>
  </div>
  <div class="field">
    <div class="head">
      <span class="label">町名</span>
      <button type="button" class="clear" id="editTowns">編集</button>
    </div>
    <div class="chips" id="towns"></div>
    <div class="town-edit" id="townEdit" hidden>
      <form class="add-row" id="addTownForm">
        <input id="newTown" type="text" placeholder="追加する町名（例：上大川前通）" autocomplete="off">
        <button type="submit">追加</button>
      </form>
      <p class="hint">町名の × で削除できます。<button type="button" class="clear" id="resetTowns">最初の町名にもどす</button></p>
    </div>
  </div>
  <div class="field">
    <div class="head">
      <span class="label">履歴</span>
      <button type="button" class="clear" id="clear" hidden>すべて消す</button>
    </div>
    <ul class="saved" id="saved"></ul>
    <p class="empty" id="empty">検索した住所がここに残ります。タップするともう一度ヤフーマップで開けます。</p>
  </div>
</main>

<script>
  var DEFAULT_BASE = '新潟県新潟市中央区';
  var BASE_KEY = 'yahoo-map-base';

  function loadBase() {
    try {
      var v = localStorage.getItem(BASE_KEY);
      if (v !== null) return v;
    } catch (e) {}
    return DEFAULT_BASE;
  }

  function prefixOf(base) { return base ? base + ' ' : ''; }

  var PREFIX = prefixOf(loadBase());
  var TOWNS = ['東大通り','東万代','蒲原町','花園','明石','長嶺町','弁天','南万代町','春日町','水島町',
               '八千代','幸町','幸西','万代','三和町','天明町','沼垂西','沼垂東'];
  var input = document.getElementById('address');
  var search = document.getElementById('search');
  var historyList = document.getElementById('saved');
  var empty = document.getElementById('empty');
  var clearBtn = document.getElementById('clear');
  var HISTORY_KEY = 'yahoo-map-saved';
  var HISTORY_MAX = 30;

  var IS_ANDROID = /Android/i.test(navigator.userAgent);

  function mapUrl(address) {
    // Androidでは geo: で地図アプリ（ヤフーマップ）を開く
    if (IS_ANDROID) return 'geo:0,0?q=' + encodeURIComponent(address);
    return 'https://map.yahoo.co.jp/search?q=' + encodeURIComponent(address);
  }

  // アプリで開くリンクは新しいタブを作らない
  function setMapLink(a, address) {
    a.href = mapUrl(address);
    if (IS_ANDROID) a.removeAttribute('target'); else a.target = '_blank';
  }

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return []; }
  }

  function saveHistory(items) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(items)); } catch (e) {}
  }

  var saved = loadHistory();

  function renderHistory() {
    historyList.textContent = '';
    saved.forEach(function (address, i) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      setMapLink(a, address);
      a.rel = 'noopener';
      // 共通の「新潟県新潟市中央区」は省いて表示する
      a.textContent = address.indexOf(PREFIX) === 0 ? address.slice(PREFIX.length) : address;
      var del = document.createElement('button');
      del.type = 'button';
      del.textContent = '×';
      del.setAttribute('aria-label', address + ' を履歴から消す');
      del.addEventListener('click', function () {
        saved.splice(i, 1);
        saveHistory(saved);
        renderHistory();
      });
      li.appendChild(a);
      li.appendChild(del);
      historyList.appendChild(li);
    });
    empty.hidden = saved.length > 0;
    clearBtn.hidden = saved.length === 0;
  }

  function addHistory(address) {
    if (!address || address === PREFIX.trim()) return;
    saved = saved.filter(function (x) { return x !== address; });
    saved.unshift(address);
    saved = saved.slice(0, HISTORY_MAX);
    saveHistory(saved);
    renderHistory();
  }

  search.addEventListener('click', function () { addHistory(input.value.trim()); });
  clearBtn.addEventListener('click', function () {
    saved = [];
    saveHistory(saved);
    renderHistory();
  });
  var towns = document.getElementById('towns');

  function update() {
    var address = input.value.trim();
    setMapLink(search, address);
  }

  // ボタンを押しても入力欄のフォーカス（キーボード）が外れないようにする
  function keepFocus(btn) {
    btn.addEventListener('pointerdown', function (e) { e.preventDefault(); });
    btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  }

  function focusEnd() {
    var len = input.value.length;
    input.focus();
    input.setSelectionRange(len, len);
  }

  var TOWNS_KEY = 'yahoo-map-towns';
  var editTownsBtn = document.getElementById('editTowns');
  var townEdit = document.getElementById('townEdit');
  var addTownForm = document.getElementById('addTownForm');
  var newTown = document.getElementById('newTown');
  var editing = false;

  function loadTowns() {
    try {
      var list = JSON.parse(localStorage.getItem(TOWNS_KEY));
      if (Array.isArray(list)) return list;
    } catch (e) {}
    return TOWNS.slice();
  }

  function saveTowns() {
    try { localStorage.setItem(TOWNS_KEY, JSON.stringify(townList)); } catch (e) {}
  }

  var townList = loadTowns();

  function renderTowns() {
    towns.textContent = '';
    towns.classList.toggle('editing', editing);
    townList.forEach(function (name, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = name;
      if (editing) {
        b.setAttribute('aria-label', name + ' を削除');
        b.addEventListener('click', function () {
          townList.splice(i, 1);
          saveTowns();
          renderTowns();
        });
      } else {
        b.setAttribute('aria-pressed', input.value === PREFIX + name ? 'true' : 'false');
        keepFocus(b);
        b.addEventListener('click', function () {
          towns.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', 'true');
          input.value = PREFIX + name;
          // 数字キーボードに切り替える（表示中のキーボードを切り替えるため一度フォーカスを外す）
          input.setAttribute('inputmode', 'numeric');
          input.blur();
          focusEnd();
          update();
        });
      }
      towns.appendChild(b);
    });
  }

  editTownsBtn.addEventListener('click', function () {
    editing = !editing;
    editTownsBtn.textContent = editing ? '完了' : '編集';
    townEdit.hidden = !editing;
    renderTowns();
  });

  addTownForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = newTown.value.trim();
    if (name && townList.indexOf(name) === -1) {
      townList.push(name);
      saveTowns();
      renderTowns();
    }
    newTown.value = '';
    newTown.focus();
  });

  document.getElementById('resetTowns').addEventListener('click', function () {
    townList = TOWNS.slice();
    saveTowns();
    renderTowns();
  });

  renderTowns();

  var editBaseBtn = document.getElementById('editBase');
  var baseEdit = document.getElementById('baseEdit');
  var baseInput = document.getElementById('baseInput');

  function setBase(base) {
    var oldPrefix = PREFIX;
    PREFIX = prefixOf(base);
    try { localStorage.setItem(BASE_KEY, base); } catch (e) {}
    // 入力欄の住所の頭も新しい住所に入れかえる
    if (input.value.indexOf(oldPrefix) === 0) input.value = PREFIX + input.value.slice(oldPrefix.length);
    else if (!input.value.trim()) input.value = PREFIX;
    update();
    renderTowns();
    renderHistory();
  }

  function closeBaseEdit() {
    baseEdit.hidden = true;
    editBaseBtn.textContent = 'はじめの住所を編集';
  }

  editBaseBtn.addEventListener('click', function () {
    if (!baseEdit.hidden) { closeBaseEdit(); return; }
    baseInput.value = PREFIX.trim();
    baseEdit.hidden = false;
    editBaseBtn.textContent = 'やめる';
    baseInput.focus();
  });

  baseEdit.addEventListener('submit', function (e) {
    e.preventDefault();
    setBase(baseInput.value.trim());
    closeBaseEdit();
  });

  document.getElementById('resetBase').addEventListener('click', function () {
    setBase(DEFAULT_BASE);
    closeBaseEdit();
  });

  document.querySelectorAll('[data-insert]').forEach(function (b) {
    keepFocus(b);
    b.addEventListener('click', function () {
      input.value += b.getAttribute('data-insert');
      focusEnd();
      update();
    });
  });

  input.addEventListener('input', update);
  input.value = PREFIX;
  update();
  renderHistory();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
