<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ヤフーマップ起動テスト</title>
<style>
  :root { --bg: #f5f7f6; --fg: #1d2523; --muted: #5d6a66; --line: #c9d3cf; --btn: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161b1a; --fg: #e8eeec; --muted: #9aa8a3; --line: #34403c; --btn: #1f2624; color-scheme: dark } }
  body { background: var(--bg); color: var(--fg); font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width: 520px; margin: 0 auto; padding-block: 24px 40px; display: grid; gap: 12px; }
  h1 { font-size: 1.3rem; margin: 0; }
  p { margin: 0; color: var(--muted); line-height: 1.6; }
  a { display: grid; gap: 4px; padding: 14px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--btn); color: var(--fg); text-decoration: none; }
  a b { font-size: 1.1rem; }
  a small { color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>ヤフーマップ起動テスト</h1>
  <p>上から順に押して、それぞれ何が起きたか（アプリが開いて場所が出た／アプリは開いたけど場所は出ない／Web版が開いた／Playストアが開いた／何も起きない）を教えてください。</p>
  <div id="list" style="display:grid;gap:12px"></div>
</main>
<script>
  var Q = '新潟県新潟市中央区 東万代1';
  var q = encodeURIComponent(Q);
  var PKG = 'jp.co.yahoo.android.apps.map';
  var TESTS = [
    ['A', 'アプリが起動するかだけ確認（場所なし）',
      'intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=' + PKG + ';end'],
    ['B', 'yjmap:// で検索',
      'yjmap://search/?q=' + q],
    ['C', 'yjmap:// で検索（アプリ指定）',
      'intent://search/?q=' + q + '#Intent;scheme=yjmap;package=' + PKG + ';end'],
    ['D', 'yjmap:// で検索（p= で渡す）',
      'yjmap://search/?p=' + q],
    ['E', 'yjmap:// で検索（パスなし）',
      'yjmap://search?q=' + q],
    ['F', 'Web版URLをアプリ選択で開く',
      'intent://map.yahoo.co.jp/search?q=' + q + '#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end'],
    ['G', 'geo: で開く（地図アプリを選ぶ画面）',
      'geo:0,0?q=' + q]
  ];
  var list = document.getElementById('list');
  TESTS.forEach(function (t) {
    var a = document.createElement('a');
    a.href = t[2];
    a.innerHTML = '<b></b><span></span><small></small>';
    a.querySelector('b').textContent = t[0];
    a.querySelector('span').textContent = t[1];
    a.querySelector('small').textContent = t[2];
    list.appendChild(a);
  });
</script>
</body>
</html>
